<!-- Remarkbox: pick light/dark once from site theme; do not reload on toggle -->
<div id="remarkbox-div" class="remarkbox-wrap">
  <noscript>
    <iframe
      id="remarkbox-iframe"
      src="https://my.remarkbox.com/embed?nojs=true"
      style="height:600px;width:100%;border:none!important"
      tabindex="0"
      title="Comments"
    ></iframe>
  </noscript>
</div>
<script src="https://my.remarkbox.com/static/js/iframe-resizer/iframeResizer.min.js"></script>
<script>
(function () {
  var rb_owner_key = "63e653c4-fabf-11eb-ac0b-040140774501";

  // Match theme toggle storage (assets/js/_main.js): dark | light | auto
  function siteIsDark() {
    try {
      var stored = localStorage.getItem("theme") || "auto";
      if (stored === "dark") return true;
      if (stored === "light") return false;
    } catch (e) {}
    // data-theme may already be set if main.js ran first
    if (document.documentElement.getAttribute("data-theme") === "dark") return true;
    if (document.documentElement.hasAttribute("data-theme")) return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function bootRemarkbox() {
    var host = document.getElementById("remarkbox-div");
    if (!host || document.getElementById("remarkbox-iframe")) return;

    var thread_uri = window.location.href.split("#")[0];
    var thread_title = window.document.title;
    var thread_fragment = window.location.hash;
    var mode = siteIsDark() ? "dark" : "light";

    var rb_src =
      "https://my.remarkbox.com/embed" +
      "?rb_owner_key=" +
      rb_owner_key +
      "&thread_title=" +
      encodeURIComponent(thread_title) +
      "&thread_uri=" +
      encodeURIComponent(thread_uri) +
      "&mode=" +
      mode +
      thread_fragment;

    var ifrm = document.createElement("iframe");
    ifrm.setAttribute("id", "remarkbox-iframe");
    ifrm.setAttribute("scrolling", "no");
    ifrm.setAttribute("src", rb_src);
    ifrm.setAttribute("frameborder", "0");
    ifrm.setAttribute("tabindex", "0");
    ifrm.setAttribute("title", "Comments");
    ifrm.style.width = "100%";
    ifrm.style.border = "none";
    ifrm.style.background = "transparent";
    host.appendChild(ifrm);

    if (typeof iFrameResize === "function") {
      iFrameResize(
        {
          checkOrigin: ["https://my.remarkbox.com"],
          inPageLinks: true,
          initCallback: function (e) {
            if (thread_fragment && e.iFrameResizer) {
              e.iFrameResizer.moveToAnchor(thread_fragment);
            }
          },
        },
        ifrm
      );
    }
  }

  // Defer until after theme init in main.min.js (jQuery ready on DOMContentLoaded)
  function scheduleBoot() {
    setTimeout(bootRemarkbox, 0);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scheduleBoot);
  } else {
    scheduleBoot();
  }
})();
</script>
