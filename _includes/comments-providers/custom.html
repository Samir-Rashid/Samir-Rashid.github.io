<!-- Remarkbox - Your readers want to communicate with you -->
<div id="remarkbox-div" class="remarkbox-wrap">
  <noscript>
    <iframe id="remarkbox-iframe" src="https://my.remarkbox.com/embed?nojs=true" style="height:600px;width:100%;border:none!important" tabindex="0"></iframe>
  </noscript>
</div>
<script src="https://my.remarkbox.com/static/js/iframe-resizer/iframeResizer.min.js"></script>
<script>
(function () {
  var rb_owner_key = "63e653c4-fabf-11eb-ac0b-040140774501";
  var stored = null;
  try { stored = localStorage.getItem("theme"); } catch (e) {}
  var dark =
    stored === "dark" ||
    (stored !== "light" &&
      ((document.documentElement.getAttribute("data-theme") === "dark") ||
        (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)));
  var mode = dark ? "dark" : "light";

  var thread_uri = window.location.href.split("#")[0];
  var thread_title = window.document.title;
  var thread_fragment = window.location.hash;

  var rb_src =
    "https://my.remarkbox.com/embed" +
    "?rb_owner_key=" + rb_owner_key +
    "&thread_title=" + encodeURIComponent(thread_title) +
    "&thread_uri=" + encodeURIComponent(thread_uri) +
    "&mode=" + mode +
    thread_fragment;

  function create_remarkbox_iframe() {
    var ifrm = document.createElement("iframe");
    ifrm.setAttribute("id", "remarkbox-iframe");
    ifrm.setAttribute("scrolling", "no");
    ifrm.setAttribute("src", rb_src);
    ifrm.setAttribute("frameborder", "0");
    ifrm.setAttribute("tabindex", "0");
    ifrm.setAttribute("title", "Remarkbox");
    ifrm.style.width = "100%";
    document.getElementById("remarkbox-div").appendChild(ifrm);
  }

  // After theme init in main.min.js
  function boot() {
    if (document.getElementById("remarkbox-iframe")) return;
    create_remarkbox_iframe();
    iFrameResize(
      {
        checkOrigin: ["https://my.remarkbox.com"],
        inPageLinks: true,
        initCallback: function (e) {
          e.iFrameResizer.moveToAnchor(thread_fragment);
        }
      },
      document.getElementById("remarkbox-iframe")
    );
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { setTimeout(boot, 0); });
  } else {
    setTimeout(boot, 0);
  }
})();
</script>
